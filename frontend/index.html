<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta property="og:title"       content="REACH — Ministry Outreach Platform" />
    <meta property="og:description" content="Log contacts in 30 seconds. Nobody falls through." />
    <meta property="og:type"        content="website" />
    <meta name="twitter:card"       content="summary" />
    <meta name="viewport"           content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color"        content="#F2F0EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color"        content="#0F0E0C" media="(prefers-color-scheme: dark)" />
    <meta name="description"        content="REACH — Ministry Outreach Platform" />
    <meta name="mobile-web-app-capable"            content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title"        content="REACH" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest"         href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800;1,9..40,300;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>REACH</title>
    <script>
      (function() {
        var saved  = localStorage.getItem('reach-theme');
        var system = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', saved || system);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
