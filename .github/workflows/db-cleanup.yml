name: Weekly DB Cleanup

on:
  schedule:
    # Runs Monday 01:00 WAT (00:00 UTC Monday)
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql
        run: sudo apt-get install -y postgresql-client

      - name: Run cleanup queries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" << 'SQL'
            -- P2-4.6: Remove expired/revoked tokens and stale sessions
            DELETE FROM refresh_tokens
              WHERE expires_at < NOW() - INTERVAL '7 days';

            DELETE FROM otp_sessions
              WHERE expires_at < NOW() - INTERVAL '1 day';

            -- Keep 90 days of audit logs
            DELETE FROM audit_logs
              WHERE created_at < NOW() - INTERVAL '90 days';

            -- Report sizes
            SELECT
              relname AS table,
              pg_size_pretty(pg_total_relation_size(relid)) AS total_size
            FROM pg_catalog.pg_statio_user_tables
            WHERE relname IN (
              'refresh_tokens','otp_sessions','audit_logs',
              'contacts','contact_statuses','attendances','decisions'
            )
            ORDER BY pg_total_relation_size(relid) DESC;
          SQL

      - name: Check DB size against Supabase free limit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          SIZE=$(psql "$DATABASE_URL" -t -c \
            "SELECT pg_database_size(current_database())" | tr -d ' ')
          echo "DB size: $SIZE bytes ($(( SIZE / 1024 / 1024 ))MB)"
          # Warn at 450MB (90% of Supabase free tier 500MB)
          if [ "$SIZE" -gt 472000000 ]; then
            echo "::warning::Database approaching Supabase free tier limit (500MB)!"
            echo "Current: $(( SIZE / 1024 / 1024 ))MB / 500MB"
          fi
