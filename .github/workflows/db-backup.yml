name: Weekly DB Backup

on:
  schedule:
    - cron: '0 23 * * 0'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump
        run: sudo apt-get install -y postgresql-client

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATE=$(date +%Y%m%d)
          pg_dump "$DATABASE_URL" \
            --format=custom \
            --no-acl \
            --no-owner \
            -f "reach-backup-${DATE}.dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: reach-db-backup-${{ github.run_id }}
          path: reach-backup-*.dump
          retention-days: 90
